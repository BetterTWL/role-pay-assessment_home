<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>騏宏科技 職能核估系統</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for Outfit and Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- CRT Scanlines for HUD/Desktop portal telemetry vibe -->
    <div class="hud-scanlines"></div>

    <div class="workspace-canvas">
        <!-- Figma/Design tool style header metadata -->
        <div class="workspace-header">
            <div class="workspace-title">
                <span class="status-indicator-dot"></span>
                <span class="title-text">TWL PORTAL HUB</span>
                <span class="file-badge">COMPETENCY PORTAL</span>
            </div>
            <div class="workspace-controls">
                <button class="control-btn" onclick="toggleTheme()" title="切換畫布背景"><i class="fa-solid fa-circle-half-stroke"></i> 切換主題</button>
                <span class="scale-text">PREVIEW: 100%</span>
            </div>
        </div>

        <!-- Main Workspace Area -->
        <div class="workspace-main">
            <!-- Simulated Phone Frame -->
            <div class="phone-simulator">
                <!-- Outer Bezel Accents -->
                <div class="phone-volume-up"></div>
                <div class="phone-volume-down"></div>
                <div class="phone-power"></div>
                
                <!-- Phone Inner Screen -->
                <div class="phone-screen">
                    <!-- Status Bar -->
                    <div class="phone-status-bar">
                        <span class="time" id="current-time">14:02</span>
                        <div class="status-right">
                            <i class="fa-solid fa-signal"></i>
                            <i class="fa-solid fa-wifi" style="margin-left: 4px;"></i>
                            <i class="fa-solid fa-battery-three-quarters" style="margin-left: 4px;"></i>
                        </div>
                    </div>

                    <!-- Notch / Dynamic Island -->
                    <div class="phone-notch">
                        <div class="speaker-grill"></div>
                        <div class="camera-lens"></div>
                    </div>

                    <!-- Phone Scrollable Content -->
                    <div class="phone-content-wrapper">
                        <!-- Upper logo -->
                        <div class="logo-section">
                            <img src="logo.png" alt="TWL Logo" class="twl-logo">
                        </div>

                        <!-- Main Wrapped Title -->
                        <h1 class="portal-title">騏宏科技<br>職能核估系統</h1>

                        <!-- Buttons Group -->
                        <div class="button-section">
                            <a href="./web/index.html" class="neobrutal-btn btn-desktop">
                                <span class="btn-content">
                                    <i class="fa-solid fa-desktop btn-icon"></i>
                                    電腦版
                                </span>
                            </a>
                            <a href="./mobile/index.html" class="neobrutal-btn btn-mobile">
                                <span class="btn-content">
                                    <i class="fa-solid fa-mobile-screen-button btn-icon"></i>
                                    手機版
                                </span>
                            </a>
                        </div>
                    </div>

                    <!-- Home indicator -->
                    <div class="phone-home-indicator"></div>
                </div>
            </div>
        </div>

        <!-- Design Canvas Rulers for Aesthetic Preview look -->
        <div class="canvas-ruler horizontal-ruler"></div>
        <div class="canvas-ruler vertical-ruler"></div>

        <!-- Footer -->
        <div class="workspace-footer">
            <div class="footer-left">
                <span><i class="fa-solid fa-circle-nodes"></i> PORTAL WORKSPACE STATUS: ACTIVE</span>
            </div>
            <div class="footer-right">
                <span>© 2026 騏宏科技 (TWL). All rights reserved.</span>
            </div>
        </div>
    </div>

    <script>
        // Update Time script
        function updateTime() {
            const timeEl = document.getElementById('current-time');
            if (timeEl) {
                const now = new Date();
                let hours = now.getHours();
                let minutes = now.getMinutes();
                timeEl.textContent = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
            }
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Theme Toggle for outer Canvas
        function toggleTheme() {
            document.body.classList.toggle('light-canvas');
        }
    </script>
</body>
</html>
