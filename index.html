<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>騏宏科技 職能核估系統</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for Outfit and Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="portal-wrapper">
        <div class="portal-card">
            <!-- Logo Section -->
            <div class="logo-section">
                <img src="logo.png" alt="TWL Logo" class="twl-logo">
            </div>

            <!-- Main Title -->
            <h1 class="portal-title">騏宏科技<br>職能核估系統</h1>

            <!-- Buttons Group -->
            <div class="button-section">
                <!-- Desktop Link -->
                <a href="./web/index.html" class="neobrutal-btn btn-desktop">
                    <span class="btn-content">
                        <i class="fa-solid fa-desktop btn-icon"></i>
                        電腦版
                    </span>
                </a>
                
                <!-- Mobile Link with QR Code -->
                <div class="neobrutal-card btn-mobile-container">
                    <a href="./mobile/index.html" class="mobile-link">
                        <span class="btn-content">
                            <i class="fa-solid fa-mobile-screen-button btn-icon"></i>
                            手機版
                        </span>
                    </a>
                    <div class="qr-container">
                        <a href="./mobile/index.html" style="display: block; width: 100%; height: 100%;">
                            <img src="QcuttlyCt0qnFhM.jpeg" alt="手機版 QR Code" class="qr-image">
                        </a>
                    </div>
                </div>
            </div>

            <!-- Footer Section -->
            <div class="portal-footer">
                <div class="author-info">
                    製作: <img src="BetterTWLLogo_icon.png" alt="Better TWL Logo" class="footer-icon author-logo"> Better TWL
                </div>
                <a href="https://github.com/BetterTWL/role-pay-assessment_home" target="_blank" class="github-btn">
                    <img src="Github_icon.png" alt="GitHub Logo" class="footer-icon github-logo"> 檢視開源
                </a>
            </div>
        </div>
    </div>
</body>
</html>
